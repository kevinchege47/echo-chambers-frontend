name: Build & Deploy Angular

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/angular-app
  COMPOSE_SERVICE: frontend

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: true

  deploy:
    name: Deploy to VPS
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -euo pipefail

            cd ~/Kevin

            echo "Pulling latest image..."
            docker compose pull ${{ env.COMPOSE_SERVICE }}

            echo "Starting new container..."
            docker compose up -d --force-recreate ${{ env.COMPOSE_SERVICE }}

            echo "Verifying container is running..."
            sleep 5
            if [ -z "$(docker compose ps -q ${{ env.COMPOSE_SERVICE }})" ]; then
              echo "Container failed to start"
              exit 1
            fi

  notify:
    name: Telegram Notification
    needs: [docker, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          if [[ "$DOCKER_RESULT" == "success" && "$DEPLOY_RESULT" == "success" ]]; then
            ICON="✅"
            STATUS="succeeded"
          elif [[ "$DOCKER_RESULT" == "failure" ]]; then
            ICON="❌"
            STATUS="failed at build"
          elif [[ "$DEPLOY_RESULT" == "failure" ]]; then
            ICON="❌"
            STATUS="failed at deploy"
          else
            ICON="⚠️"
            STATUS="was cancelled or skipped"
          fi

          SHORT_SHA="${SHA:0:7}"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"

          MESSAGE="${ICON} *Angular deployment ${STATUS}*

          • Repo: \`${REPO}\`
          • Branch: \`${REF}\`
          • Commit: \`${SHORT_SHA}\` by @${ACTOR}
          • Build: ${DOCKER_RESULT} | Deploy: ${DEPLOY_RESULT}
          • [View run](${RUN_URL})"

          curl --fail --retry 3 --retry-delay 2 -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true" \
            -d text="${MESSAGE}"